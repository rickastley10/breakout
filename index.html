<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>minesweeper</title>
<style>
    body {
    margin: 0;
    background: #111;
    overflow: hidden;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    width: 100vw;
    height: 100vh;
}
    canvas {
    background: black;
    touch-action: none;

    width: min(100vw, 100vh);
    height: min(100vw, 100vh);
}
    button{
    margin-top: 10px;
    padding: 10px 20px;
    font-size: 16px;
    background: #333;
    color: white;
    border: 1px solid #555;
    border-radius: 5px;
    cursor: pointer;
    position: static;
}
    button:active {
    background: #555;
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const WINDOW_WIDTH = 400;
const WINDOW_HEIGHT = 400;
const w = 20;
const h = 20;

/* ============================================================
   GLOBALS
   ============================================================ */
const canvas = document.getElementById("game");
canvas.width = WINDOW_WIDTH;
canvas.height = WINDOW_HEIGHT;

const ctx = canvas.getContext("2d");

let running = true;
let dir = "right";

/* ============================================================
   INPUT
   ============================================================ */
const keys = {};

window.addEventListener("keydown", (e) => {
    keys[e.key] = true;
});

window.addEventListener("keyup", (e) => {
    keys[e.key] = false;
});

/* ============================================================
   UNIVERSAL INPUT (Single handler for Mouse + Touch)
   ============================================================ */
function handleInput(e) {
    e.preventDefault();
    
    let clientX, clientY;
    if (e.touches) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY; 
    } else {
        clientX = e.clientX;
        clientY = e.clientY;  
    }
    
    const rect = canvas.getBoundingClientRect();
    const x = clientX - rect.left;
    const y = clientY - rect.top;  
    
    // Scale coordinates to match canvas size
    const scaleX = WINDOW_WIDTH / rect.width;
    const scaleY = WINDOW_HEIGHT / rect.height;
    const canvasX = x * scaleX;
    const canvasY = y * scaleY;


    if(menu===0){
        mx=canvasX
    }
    

}

canvas.addEventListener("touchstart", handleInput);
canvas.addEventListener("mousedown", handleInput);

/* ============================================================
   GAME STATE
   ============================================================ */

px=200
py=360

mx=999

bx=200
by=200
vx=5
vy=5

bd=2
pd=2

bricks=[]
for(let x=0;x<10;x++){
    for(let y=0;y<5;y++){
        bricks.push({
            "x":0+(x*40),
            "y":0+(y*30),
            "a":1,
            "colour": Math.floor(Math.random()*4)+1  // 1 - red      2 - green       3 - blue       4 - white
        })
    }
}
lives=3
menu=0
/* ============================================================
   MAIN LOOP
   ============================================================ */
function game_loop() {
    if (!running) return;
        
        ctx.font = "15px Arial";
        if(menu===0){
            
            
            if (keys["a"]){
                if(px!==0){
                    px=px-20
                }
                pd=1

                mx=999
            }
            else if (keys["d"]){
                if(px!==400-w*3){
                    px=px+20
                }
                pd=3
                mx=999
            }
            else{
                pd=2
            }


            if (keys["ArrowLeft"]){
                if(px!==0){
                    px=px-20
                }
                pd=1

                mx=999
            }
            else if (keys["ArrowRight"]){
                if(px!==400-w*3){
                    px=px+20
                }
                pd=3
                mx=999
            }
            else{
                pd=2
            }
            bx=bx+vx
            by=by+vy


            if(px+30<mx && mx!==999){
                px=px+w
                if(px!==400-w*3){
                    px=px+20
                }
                pd=3
            }
            else if(px>mx && mx!==999){
                if(px!==0){
                    px=px-20
                }
                pd=1
            }
            else{
                pd=2
            }



            if(px<= bx && bx <= px+w*3 && py <= by+h && by+h <= py+h/2){

                vy=-vy

                if(bd === pd){
                    if(vx < 0){
                        vx=vx-2
                    }
                    if(vx > 0){
                        vx=vx+2
                    }
                }
                else if((bd===1&&pd===3)||(bd===3 && pd===1)){
                    if(vx < 0){
                        vx=vx+2
                    }
                    if(vx > 0){
                        vx=vx-2
                    }
                }
            }

            for(let i of bricks){
                if(i["x"]<= bx && bx <= i["x"]+30 && i["y"] <= by && by <= i["y"]+10 && i["a"]===1){
                    vy=-vy
                    i["a"]=0
                }
            }
            if(400 <= bx+w){
                vx=-vx
                bd=1
            }
            if(bx <= 0){
                vx=-vx
                bd=3
            }
            if(by <= 0){
                vy=-vy
            }

            if(400 <= by){
                //game over -------------------------
                lives=lives-1
                
                by=200
                vx=5

                if(lives===0){
                    px=200
                    py=360

                    mx=999

                    bx=200
                    by=200
                    vx=5
                    vy=5

                    bd=2
                    pd=2

                    bricks=[]
                    for(let x=0;x<10;x++){
                        for(let y=0;y<5;y++){
                            bricks.push({
                                "x":0+(x*40),
                                "y":0+(y*30),
                                "a":1,
                                "colour": Math.floor(Math.random()*4)+1  // 1 - red      2 - green       3 - blue       4 - white
                            })
                        }
                    }
                    lives=3
                    ctx.font = "30px Arial";
                    ctx.fillStyle="#FFFFFF"
                    ctx.fillText("you lost", 200, 200)
                    menu=1
                    
                }
            }
            /* ===== RENDER ===== */
            //clear screen
            ctx.fillStyle="#000000"
            ctx.fillRect(0, 0, WINDOW_WIDTH, WINDOW_HEIGHT)


            ctx.fillStyle="#FF0000"
            ctx.fillRect(px, py, w*3, h/2)

            ctx.fillStyle="#FF0000"
            ctx.fillRect(bx, by, w, h)
            z=0
            x=0
            for(let i of bricks){
                
                if(i["a"]===1){
                    if(i["colour"]===1){
                        ctx.fillStyle="#FF0000"
                    }
                    if(i["colour"]===2){
                        ctx.fillStyle="#00FF00"
                    }
                    if(i["colour"]===3){
                        ctx.fillStyle="#0000FF"
                    }
                    if(i["colour"]===4){
                        ctx.fillStyle="#FFFFFF"
                    }
                    
                    ctx.fillRect(i["x"], i["y"], 30, 10)
                    z=z+1

                }
                x=x+1
            }
            if(z===0){
                for(let x=0;x<10;x++){
                    for(let y=0;y<6;y++){
                        bricks.push({
                            "x":0+(x*40),
                            "y":0+(y*30),
                            "a":1,
                            "colour": Math.floor(Math.random()*4)+1  // 1 - red      2 - green       3 - blue       4 - white
                        })
                    }
                }
            }
        }
        ctx.fillStyle="#FF0000"
        ctx.fillText(lives, 10-2, 20-2)
        ctx.fillStyle="#0000FF"
        ctx.fillText(lives, 10+2, 20+2)
        ctx.fillStyle="#FFFFFF"
        ctx.fillText(lives, 10, 20)

    setTimeout(() => {
        requestAnimationFrame(game_loop);
    }, 50);
}

game_loop();
</script>
<button onclick="if(menu===1){menu=0;}else{menu=1;}">pause / unpause</button>
</body>
</html>
