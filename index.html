<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>breakout</title>
<style>
    body {
    margin: 0;
    background: #111;
    overflow: hidden;

    display: flex;
    justify-content: center;
    align-items: center;

    width: 100vw;
    height: 100vh;
}
    canvas {
    background: black;
    touch-action: none;

    width: min(100vw, 100vh);
    height: min(100vw, 100vh);
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const WINDOW_WIDTH = 400;
const WINDOW_HEIGHT = 400;
const w = 40;
const h = 40;

/* ============================================================
   GLOBALS
   ============================================================ */
const canvas = document.getElementById("game");
canvas.width = WINDOW_WIDTH;
canvas.height = WINDOW_HEIGHT;

const ctx = canvas.getContext("2d");

let running = true;
let dir = "right";

/* ============================================================
   INPUT
   ============================================================ */
const keys = {};

window.addEventListener("keydown", (e) => {
    keys[e.key] = true;
});

window.addEventListener("keyup", (e) => {
    keys[e.key] = false;
});

/* ============================================================
   UNIVERSAL INPUT (Single handler for Mouse + Touch)
   ============================================================ */
function handleInput(e) {
    e.preventDefault();
    
    let clientX, clientY;
    if (e.touches) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY; 
    } else {
        clientX = e.clientX;
        clientY = e.clientY;  
    }
    
    const rect = canvas.getBoundingClientRect();
    const x = clientX - rect.left;
    const y = clientY - rect.top;  
    
    // Scale coordinates to match canvas size
    const scaleX = WINDOW_WIDTH / rect.width;
    const scaleY = WINDOW_HEIGHT / rect.height;
    const canvasX = x * scaleX;
    const canvasY = y * scaleY;


    gotoX=canvasX-20

    if(175 <=canvasX&& canvasX <=225 && canvasY <=50){
        if(menu===1){
            menu=0
        }
        else{
            menu=1
        }
    }
}

canvas.addEventListener("touchstart", handleInput);
canvas.addEventListener("mousedown", handleInput);

/* ============================================================
   GAME STATE
   ============================================================ */
function reset(){
    //ball
    ball_x =200
    ball_y =200

    ball_vx =5
    ball_vy =5

    ball_bottom =ball_y+10
    ball_right =ball_x+10


    //paddle
    paddle_x =180
    paddle_y =360

    paddle_bottom =paddle_y+6
    paddle_right =paddle_x+40

    level=0

    bricks = []
    for (y=1;y<(5+level);y++){
        for (x=1;x<10;x++){
            bricks.push({
                "x":x*38,
                "y":y*20,
                "on":1,
                "colour": Math.floor(Math.random()*7)+1
            })
        }
    }

    score=0
    gotoX=999
}


reset()

brick_width = 20
brick_height = 8

menu=0

/* ============================================================
   MAIN LOOP
   ============================================================ */
function game_loop() {
    if (!running) return;
        
        ctx.font = "15px Arial";
        

        if (keys["d"]){
            if(paddle_x <= 360){
                paddle_x=paddle_x+20;
            }
        }
        if (keys["a"]){
            if(paddle_x>=0){
                paddle_x=paddle_x-20;
            }
        }
        if (keys["ArrowRight"]){
            if(paddle_x <= 360){
                paddle_x=paddle_x+20;
            }
        }
        if (keys["ArrowLeft"]){
            if(paddle_x>=0){
                paddle_x=paddle_x-20;
            }
        }

        if(menu===0){

            

            if(gotoX!==999){
                if(Math.abs(paddle_x - gotoX)<20){
                    gotoX=999
                }

                if(paddle_x+10<gotoX){
                    paddle_x+=20
                }
                else if(paddle_x>gotoX){
                    paddle_x-=20
                }
            }


            ball_x=ball_x+ball_vx
            ball_y=ball_y+ball_vy


            


            ball_bottom =ball_y+10
            ball_right =ball_x+10
            paddle_bottom =paddle_y+6
            paddle_right =paddle_x+40



            if(ball_x <= 0){ball_vx=-ball_vx}
            if(ball_x >= 380){ball_vx=-ball_vx}
            if(ball_y <= 0){ball_vy=-ball_vy}

            if(ball_y > 400){
                reset()
            }

            
            if(ball_bottom >= paddle_y && paddle_bottom >= ball_y && paddle_x <= ball_right && ball_x <= paddle_right){
                ball_vy=-ball_vy
            }

            for (i of bricks){
                if(i["on"] === 1 &&
                ball_right  >= i["x"] &&
                ball_x      <= i["x"] + brick_width &&
                ball_bottom >= i["y"] &&
                ball_y      <= i["y"] + brick_height){

                    i["on"] = 0;
                    score++

                    
                    overlapX = Math.min(ball_right - i["x"], (i["x"] + brick_width) - ball_x);
                    overlapY = Math.min(ball_bottom - i["y"], (i["y"] + brick_height) - ball_y);

                    if(overlapX < overlapY){
                        ball_vx = -ball_vx;
                    } else {
                        ball_vy = -ball_vy;
                    }
                }
            }

            x=0
            y=0
            for (i of bricks){
                x++
                if(i["on"]===0){
                    y++
                }
            }
            if(x===y){
                level++

                bricks = []
                for (y=1;y<(5+level);y++){
                    for (x=1;x<10;x++){
                        bricks.push({
                            "x":x*38,
                            "y":y*20,
                            "on":1,
                            "colour": Math.floor(Math.random()*7)+1
                        })
                    }
                }
            }
        }

        /* ===== RENDER ===== */
        //clear screen
        ctx.fillStyle="#000000"
        ctx.fillRect(0, 0, WINDOW_WIDTH, WINDOW_HEIGHT)

        ctx.fillStyle="#FF0000"
        ctx.fillRect(ball_x, ball_y, 10, 10)
        ctx.fillRect(paddle_x, paddle_y, 40, 6)

        for(i of bricks){
            if(i["on"]===0){
                continue
            }
            if(i["colour"]===1){
                ctx.fillStyle="#FF0000"
            }
            else if(i["colour"]===2){
                ctx.fillStyle="#00FF00"
            }
            else if(i["colour"]===3){
                ctx.fillStyle="#0000FF"
            }
            else if(i["colour"]===4){
                ctx.fillStyle="#FFFF00"
            }
            else if(i["colour"]===5){
                ctx.fillStyle="#00FFFF"
            }
            else if(i["colour"]===6){
                ctx.fillStyle="#FFFFFF"
            }
            else if(i["colour"]===7){
                ctx.fillStyle="#F0000F"
            }
            ctx.fillRect(i["x"], i["y"], brick_width, brick_height)
        }

        ctx.font = "15px Arial";

        ctx.fillText(score, 10, 20)

        ctx.fillStyle="#ffffff"
        ctx.fillText("||",200, 20)


       // paddle_x=ball_x
    setTimeout(() => {
        requestAnimationFrame(game_loop);
    }, 50);
}

game_loop();
</script>
</body>
</html>
